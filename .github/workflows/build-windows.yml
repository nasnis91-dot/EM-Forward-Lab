name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm EM-Forward-Lab.spec
      - name: Zip
        run: Compress-Archive -Path dist/EM-Forward-Lab/* -DestinationPath EM-Forward-Lab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Forward-Lab-Windows
          path: EM-Forward-Lab-Windows.zip
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EM-Forward-Lab-Windows.zip

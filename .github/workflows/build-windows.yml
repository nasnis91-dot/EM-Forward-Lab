name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        continue-on-error: true
        run: python -m pytest -q -rf
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm EM-Forward-Lab.spec
      - name: Zip
        run: Compress-Archive -Path dist/EM-Forward-Lab/* -DestinationPath EM-Forward-Lab-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Forward-Lab-Windows
          path: EM-Forward-Lab-Windows.zip
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: EM-Forward Lab 2.0.0 (Windows)
          body: |
            Windows build of EM-Forward Lab — Universitas Syiah Kuala. Developed by Yanis Mawardinur.
            Download EM-Forward-Lab-Windows.zip, extract it, and run EM-Forward-Lab.exe.
          files: EM-Forward-Lab-Windows.zip
